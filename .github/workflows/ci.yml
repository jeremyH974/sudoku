name: CI

on:
  # « master » et « main » : la branche du dépôt est master, et l'oubli a rendu
  # le déclenchement sur push inopérant pendant six incréments. Les deux noms
  # sont acceptés pour que la question ne se repose pas.
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Ordre volontaire : le typecheck echoue le plus vite et donne les erreurs
      # les plus lisibles, les tests sont les plus lents.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
