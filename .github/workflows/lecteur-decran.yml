# La validation au lecteur d'écran, exécutée par la machine.
#
# ─── Pourquoi ce n'est PAS dans `ci.yml` ──────────────────────────────────────
#
# `ci.yml` tourne en une minute sur Linux et garde la publication : c'est un
# portail, et tout ce qui le franchit doit être rapide et sûr. Ce job-ci est
# l'inverse — un runner Windows, quatre cents mégaoctets de NVDA portable, un
# navigateur réel et un lecteur d'écran qui tape au clavier. Le mettre sur le
# chemin de chaque poussée reviendrait à faire dépendre la mise en ligne d'un
# logiciel tiers dont l'incrément 21 a mesuré qu'il n'annonce pas le rôle
# `grid` — un échec en amont, que rien de notre côté ne rattraperait.
#
# Il tourne donc **à la demande** et **une fois par semaine**. C'est le motif
# retenu partout pour les tests de technologie d'assistance : ils détectent les
# dérives, ils ne gardent pas la porte.
#
# ─── Ce qu'il mesure, et que rien d'autre ne mesure ───────────────────────────
#
# Les tests `*.a11y.test.ts` voient l'arbre d'accessibilité ; ils ne disent rien
# de ce qui est **prononcé**. Ce job écoute. Voir `docs/lecteur-decran.md` pour
# le protocole, les relevés verbatim et les verdicts déjà rendus.
name: Lecteur d'écran

on:
  workflow_dispatch:
  schedule:
    # Lundi 6 h UTC. Un rendez-vous hebdomadaire suffit à voir une dérive, et
    # ne consomme pas un runner Windows à chaque commit.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  nvda:
    runs-on: windows-latest
    # NVDA met quelques secondes à démarrer, le navigateur aussi, et le
    # protocole attend entre chaque frappe. Vingt minutes est large ; le but
    # est qu'un blocage finisse par rendre la main plutôt que de tourner.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # On mesure le site **de ce commit**, pas celui qui est en ligne : un job
      # qui interrogerait l'adresse publique validerait la version précédente.
      - run: pnpm build

      # La version de NVDA vient du `manifest.json` de `@guidepup/guidepup`, et de
      # lui seul : c'est lui qui décide quelle archive le client sait piloter.
      # On le lit pour la clé de cache **et** pour le téléchargement, de sorte
      # qu'une montée de version invalide le cache toute seule.
      - name: Version de NVDA attendue
        id: nvda
        shell: pwsh
        run: |
          $m = Get-Content node_modules/@guidepup/guidepup/manifest.json | ConvertFrom-Json
          $a = ($m.screenReaders | Where-Object { $_.id -eq 'nvda' }).assets[0]
          "version=$($a.version)"     >> $env:GITHUB_OUTPUT
          "asset=$($a.asset)"         >> $env:GITHUB_OUTPUT
          "repo=$($a.repository)"     >> $env:GITHUB_OUTPUT
          "sha256=$($a.sha256)"       >> $env:GITHUB_OUTPUT
          "NVDA attendu : $($a.version)"

      # 405 Mo une fois décompressé : on le garde d'une semaine sur l'autre.
      - name: Cache de NVDA portable
        id: cache-nvda
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\guidepup
          key: nvda-${{ runner.os }}-${{ steps.nvda.outputs.version }}

      # ─── Pourquoi l'installation est écrite ici, en clair ──────────────────
      #
      # `@guidepup/setup` ferait exactement cela, en une ligne. Mais il dépend de
      # `@guidepup/record`, qui dépend de `ffmpeg-static` : **quatre-vingts
      # mégaoctets**, téléchargés à chaque installation du dépôt, y compris sur
      # la CI Linux qui tourne en une minute et n'a que faire d'un encodeur
      # vidéo. Pour un projet qui compte ses dépendances, c'était non.
      #
      # Ce qui reste est un téléchargement et une décompression — et l'écrire
      # nous-mêmes ajoute ce que l'outil ne faisait pas voir : la **somme de
      # contrôle est vérifiée**, et elle vient du manifeste, pas d'ici.
      - name: Installer NVDA portable
        if: steps.cache-nvda.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.nvda.outputs.version }}'
          # Barres obliques : Windows les accepte, et aucune couche que ce
          # fichier traverse ne les échappe.
          $racine  = Join-Path $env:LOCALAPPDATA "guidepup/nvda/all/$version"
          $zip     = Join-Path $racine '${{ steps.nvda.outputs.asset }}'
          New-Item -ItemType Directory -Force $racine | Out-Null

          $url = "https://github.com/${{ steps.nvda.outputs.repo }}/releases/download/$version/${{ steps.nvda.outputs.asset }}"
          "Téléchargement : $url"
          Invoke-WebRequest -UseBasicParsing $url -OutFile $zip

          $vu = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($vu -ne '${{ steps.nvda.outputs.sha256 }}') {
            "Somme de contrôle inattendue : $vu"
            exit 1
          }
          "Somme de contrôle vérifiée."

          Expand-Archive -Path $zip -DestinationPath (Join-Path $racine 'extracted') -Force
          $exe = Join-Path $racine 'extracted/nvda.exe'
          if (-not (Test-Path $exe)) { "nvda.exe introuvable après décompression."; exit 1 }
          "NVDA en place : $exe"

      # Le serveur d'aperçu sert `packages/app/dist`, c'est-à-dire exactement ce
      # que `pnpm build` vient de produire.
      # `bash` et `&`, non `Start-Process` : celui-ci ne survivait pas à la fin de
      # son étape, et l'attente ci-dessous expirait sur un serveur mort-né. Un
      # processus lancé en arrière-plan depuis bash, lui, traverse les étapes.
      - name: Servir le site construit
        shell: bash
        run: |
          pnpm --filter @sudoku/app preview --port 4181 > preview.log 2>&1 &
          echo "Serveur lancé."

      - name: Attendre que le serveur réponde
        shell: bash
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:4181/sudoku/sudoku/; then
              echo "Le serveur répond."
              exit 0
            fi
            sleep 2
          done
          echo "Le serveur n'a jamais répondu. Son journal :"
          cat preview.log || echo "(aucun journal)"
          exit 1

      # `SANS_CLIC=1` : sur un runner, rien d'autre ne tourne, donc la fenêtre du
      # navigateur a le focus. Le script le **vérifie** quand même en demandant
      # son titre à NVDA, et refuse de mesurer sinon — c'est ce qui a évité un
      # relevé faux à l'incrément 21, quand trois frappes étaient parties dans
      # une autre application.
      - name: Écouter
        env:
          BASE: http://localhost:4181/sudoku/
          SANS_CLIC: '1'
        run: node scripts/lecteur-decran.mjs

      # Toujours, même en échec : le relevé verbatim est la seule chose qui
      # permette de contester un verdict.
      - name: Joindre le relevé
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: releve-lecteur-decran
          path: releve-lecteur-decran.json
          if-no-files-found: warn
