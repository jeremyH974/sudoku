<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!--
      Deux couleurs de barre d'adresse, et non une.

      Une valeur unique laissait Android peindre sa barre en bleu de marque
      au-dessus d'une page presque noire. Le `media` accorde la barre au thème du
      système ; le sélecteur, lui, a trois états, et un choix explicite ne déplace
      aucun `media` : c'est `theme.svelte.ts` qui s'en charge, en insérant sa
      propre balise devant celles-ci — le navigateur retient la première dont le
      `media` correspond.
    -->
    <meta name="theme-color" content="#1f4e8c" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      La manuscrite est préchargée, et c'est ce qui la fait arriver sur le
      papier. Une police n'est téléchargée que lorsque le navigateur la juge
      employée ; celle du cahier ne sert qu'à l'impression, donc son
      téléchargement ne commençait qu'au moment où l'impression démarrait.

      Sans attribut `media`, et avec une URL **strictement identique** à celle du
      `src` de la règle `@font-face` : une URL qui diffère d'un caractère
      provoque un second téléchargement, signalé en console par « preloaded but
      not used ».

      L'accueil ne la précharge pas : il ne l'emploie pas encore, et précharger
      une police inutilisée est exactement le même avertissement, à l'envers.
    -->
    <link
      rel="preload"
      href="/fonts/patrick-hand-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta
      name="description"
      content="Générateur et jeu de Sudoku. Aucune installation, aucune publicité, aucun compte."
    />
    <title>Sudoku</title>
    <!--
      L'aperçu des liens partagés — la première chose que verra quelqu'un à qui
      l'on envoie l'adresse.

      `og:url` est omis à dessein : les réseaux prennent alors l'adresse
      demandée, qui est toujours juste, là où une adresse écrite en dur
      vieillirait au premier déménagement. `og:image` n'a pas ce luxe — les
      robots ne résolvent pas tous un chemin relatif —, alors `appBase.test.ts`
      la tient à l'adresse annoncée par le README.
    -->
    <meta property="og:title" content="Sudoku — générateur et jeu" />
    <meta
      property="og:description"
      content="Difficulté mesurée, indices qui expliquent, cahiers imprimables. Sans installation, sans publicité, sans compte."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:image" content="https://jeremyh974.github.io/sudoku/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Une grille de Sudoku, une case mise en évidence, et sous elle l’indice qui nomme la technique et explique le raisonnement."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      /*
        Applique le thème choisi AVANT le premier rendu.

        Si l'on attendait le démarrage de l'application, la page s'afficherait
        une fraction de seconde dans le thème du système avant de basculer —
        un flash blanc en pleine nuit, particulièrement désagréable. D'où ce
        script, volontairement inline et synchrone : il doit s'exécuter avant
        que quoi que ce soit ne soit peint.
      */
      (function () {
        try {
          var stored = localStorage.getItem('sudoku.theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
          /*
            Même raison pour la taille du texte : sans cette ligne la page
            peindrait à 100 %, puis toute la mise en page sauterait d'un cran.
            Un saut est plus désagréable qu'un flash de couleur, et il touche
            précisément les personnes qui ont choisi ce réglage.
          */
          var size = localStorage.getItem('sudoku.text-size');
          if (size === 'large' || size === 'xlarge') {
            document.documentElement.setAttribute('data-text-size', size);
          }
        } catch (e) {
          /* stockage indisponible : on suivra le système */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
