<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1f4e8c" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      La manuscrite est préchargée, et c'est ce qui la fait arriver sur le
      papier. Une police n'est téléchargée que lorsque le navigateur la juge
      employée ; celle du cahier ne sert qu'à l'impression, donc son
      téléchargement ne commençait qu'au moment où l'impression démarrait.

      Sans attribut `media`, et avec une URL **strictement identique** à celle du
      `src` de la règle `@font-face` : une URL qui diffère d'un caractère
      provoque un second téléchargement, signalé en console par « preloaded but
      not used ».

      L'accueil ne la précharge pas : il ne l'emploie pas encore, et précharger
      une police inutilisée est exactement le même avertissement, à l'envers.
    -->
    <link
      rel="preload"
      href="/fonts/patrick-hand-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta
      name="description"
      content="Enquête : six suspects, un par rangée et un par colonne, et ce qu'ils disent d'eux-mêmes. La victime était seule avec le meurtrier."
    />
    <title>Enquête</title>
    <meta property="og:title" content="Enquête — une déduction sur un plan" />
    <meta
      property="og:description"
      content="Placer six suspects sur le plan d'un manoir à partir de leurs seules déclarations, et trouver qui restait seul avec la victime."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:image" content="https://jeremyh974.github.io/sudoku/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Une grille de Sudoku, une case mise en évidence, et sous elle l’indice qui nomme la technique et explique le raisonnement."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      /*
        Le thème et la taille du texte, appliqués AVANT le premier rendu. Copie
        conforme des deux autres entrées ; `appBase.test.ts` le vérifie.
      */
      (function () {
        try {
          var stored = localStorage.getItem('sudoku.theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
          var size = localStorage.getItem('sudoku.text-size');
          if (size === 'large' || size === 'xlarge') {
            document.documentElement.setAttribute('data-text-size', size);
          }
        } catch (e) {
          /* stockage indisponible : on suivra le système */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/enquete/main.ts"></script>
  </body>
</html>
